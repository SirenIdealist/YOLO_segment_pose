# COCO SegmentPose dataset for joint segmentation and pose estimation
# Label format per line: class x y w h kpt1_x kpt1_y kpt1_v ... kpt17_x kpt17_y kpt17_v seg1_x seg1_y ... segN_x segN_y
# Example usage: yolo train data=coco-segpose.yaml task=segment_pose model=yolov8n-segpose.yaml

# Train/val/test sets
path: coco-segpose # dataset root dir
train: images/train2017 # train images
val: images/val2017 # val images
test: images/test-dev2017 # test images (optional)

# Keypoints
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes
names:
  0: person

# Keypoint names per class
kpt_names:
  0:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
